function drawPoster() {
  const canvas = document.getElementById('poster-canvas');
  const ctx = canvas.getContext('2d');
  const text = document.getElementById('poster-text').value || '在这里写下你的金句';
  const author = document.getElementById('poster-author').value;
  const W = 900;
  const H = 1200;
  const accent = tweaks.accent || '#C04A1A';

  // 清空
  ctx.clearRect(0, 0, W, H);

  switch (currentPosterTemplate) {
    case 'minimal':
      drawMinimalPoster(ctx, W, H, text, author, accent);
      break;
    case 'gradient':
      drawGradientPoster(ctx, W, H, text, author, accent);
      break;
    case 'dark':
      drawDarkPoster(ctx, W, H, text, author, accent);
      break;
    case 'paper':
      drawPaperPoster(ctx, W, H, text, author, accent);
      break;
  }
}

function drawMinimalPoster(ctx, W, H, text, author, accent) {
  // 背景
  ctx.fillStyle = '#FAF8F5';
  ctx.fillRect(0, 0, W, H);

  // 装饰线
  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(80, 100);
  ctx.lineTo(200, 100);
  ctx.stroke();

  // 大引号装饰
  ctx.fillStyle = 'rgba(192, 74, 26, 0.08)';
  ctx.font = 'italic 200px "Georgia", serif';
  ctx.fillText('"', 60, 280);

  // 正文
  ctx.fillStyle = '#1A1A1A';
  ctx.textAlign = 'center';
  wrapText(ctx, text, W / 2, 400, W - 160, 52, '36px "Noto Serif SC", Georgia, serif');

  // 署名
  if (author) {
    ctx.fillStyle = '#9A9A9A';
    ctx.font = 'italic 22px "Georgia", serif';
    ctx.fillText('— ' + author, W / 2, H - 160);
  }

  // 底部品牌
  ctx.fillStyle = '#C0B8AE';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillText('Claude 排版', W / 2, H - 60);
}

function drawGradientPoster(ctx, W, H, text, author, accent) {
  // 渐变背景
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, accent);
  grad.addColorStop(1, adjustColor(accent, -40));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 白色卡片
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(ctx, 60, 180, W - 120, H - 360, 16);
  ctx.fill();

  // 文字
  ctx.fillStyle = '#1A1A1A';
  ctx.textAlign = 'center';
  wrapText(ctx, text, W / 2, 320, W - 200, 48, '32px "Noto Serif SC", Georgia, serif');

  if (author) {
    ctx.fillStyle = '#7A7A7A';
    ctx.font = 'italic 20px "Georgia", serif';
    ctx.fillText('— ' + author, W / 2, H - 280);
  }

  // 底部装饰
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillText('Claude 排版', W / 2, H - 60);
}

function drawDarkPoster(ctx, W, H, text, author, accent) {
  ctx.fillStyle = '#1A1A1A';
  ctx.fillRect(0, 0, W, H);

  // 细边框
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.strokeRect(50, 50, W - 100, H - 100);

  ctx.fillStyle = '#F0EEE6';
  ctx.textAlign = 'center';
  wrapText(ctx, text, W / 2, 380, W - 180, 52, '36px "Noto Serif SC", Georgia, serif');

  if (author) {
    ctx.fillStyle = '#9A958C';
    ctx.font = 'italic 22px "Georgia", serif';
    ctx.fillText('— ' + author, W / 2, H - 180);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillText('Claude 排版', W / 2, H - 60);
}

function drawPaperPoster(ctx, W, H, text, author, accent) {
  ctx.fillStyle = '#F5F0E8';
  ctx.fillRect(0, 0, W, H);

  // 纸张纹理感线条
  ctx.strokeStyle = 'rgba(0,0,0,0.03)';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // 左侧色条
  ctx.fillStyle = accent;
  ctx.fillRect(60, 200, 6, H - 400);

  ctx.fillStyle = '#2C2C2C';
  ctx.textAlign = 'left';
  wrapText(ctx, text, 100, 320, W - 180, 52, '34px "Noto Serif SC", Georgia, serif');

  if (author) {
    ctx.fillStyle = '#8A8279';
    ctx.font = 'italic 20px "Georgia", serif';
    ctx.fillText('— ' + author, 100, H - 200);
  }

  ctx.fillStyle = '#B0A89E';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Claude 排版', W / 2, H - 60);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, font) {
  ctx.font = font;
  const words = text.split('');
  let line = '';
  let currentY = y;

  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && line !== '') {
      ctx.fillText(line, x, currentY);
      line = words[i];
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, currentY);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
  const b = Math.max(0, Math.min(255, (num & 0x00FF) + amount));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function fillCoverFromArticle() {
  const article = document.getElementById('article-preview');
  const h1 = article.querySelector('h1');
  const h2 = article.querySelector('h2');

  document.getElementById('cover-title').value = h1 ? h1.textContent.trim() : '';
  document.getElementById('cover-subtitle').value = h2 ? h2.textContent.trim() : '';
  drawCover();
}

function drawCover() {
  const canvas = document.getElementById('cover-canvas');
  const ctx = canvas.getContext('2d');
  const title = document.getElementById('cover-title').value || '文章标题';
  const subtitle = document.getElementById('cover-subtitle').value;
  const W = canvas.width;
  const H = canvas.height;
  const accent = tweaks.accent || '#C04A1A';

  ctx.clearRect(0, 0, W, H);

  switch (currentCoverStyle) {
    case 'gradient':
      drawGradientCover(ctx, W, H, title, subtitle, accent);
      break;
    case 'glass':
      drawGlassCover(ctx, W, H, title, subtitle, accent);
      break;
    case 'minimal':
      drawMinimalCover(ctx, W, H, title, subtitle, accent);
      break;
  }
}

function drawGradientCover(ctx, W, H, title, subtitle, accent) {
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, accent);
  grad.addColorStop(0.5, adjustColor(accent, 30));
  grad.addColorStop(1, '#1A1A2E');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 装饰圆
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.3, W * 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';

  const titleSize = W > 600 ? 42 : 28;
  wrapText(ctx, title, W / 2, H * 0.4, W - 80, titleSize * 1.4, 'bold ' + titleSize + 'px "Noto Serif SC", Georgia, serif');

  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const subSize = W > 600 ? 20 : 14;
    ctx.font = subSize + 'px -apple-system, sans-serif';
    ctx.fillText(subtitle, W / 2, H * 0.7);
  }
}

function drawGlassCover(ctx, W, H, title, subtitle, accent) {
  // 背景
  ctx.fillStyle = '#F0ECE6';
  ctx.fillRect(0, 0, W, H);

  // 毛玻璃卡片
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  const cardPad = W * 0.08;
  roundRect(ctx, cardPad, cardPad, W - cardPad * 2, H - cardPad * 2, 20);
  ctx.fill();

  // 卡片边框
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 装饰色块
  ctx.fillStyle = accent + '33';
  roundRect(ctx, cardPad + 20, cardPad + 20, 60, 60, 12);
  ctx.fill();

  ctx.fillStyle = '#1A1A1A';
  ctx.textAlign = 'left';
  const titleSize = W > 600 ? 36 : 24;
  wrapText(ctx, title, cardPad + 30, H * 0.45, W - cardPad * 2 - 60, titleSize * 1.4, 'bold ' + titleSize + 'px "Noto Serif SC", Georgia, serif');

  if (subtitle) {
    ctx.fillStyle = '#7A7A7A';
    const subSize = W > 600 ? 16 : 12;
    ctx.font = subSize + 'px -apple-system, sans-serif';
    ctx.fillText(subtitle, cardPad + 30, H * 0.75);
  }
}

function drawMinimalCover(ctx, W, H, title, subtitle, accent) {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);

  // 左侧竖线
  ctx.fillStyle = accent;
  const lineW = W > 600 ? 8 : 5;
  ctx.fillRect(W * 0.1, H * 0.2, lineW, H * 0.6);

  ctx.fillStyle = '#1A1A1A';
  ctx.textAlign = 'left';
  const titleSize = W > 600 ? 44 : 28;
  wrapText(ctx, title, W * 0.1 + lineW + 20, H * 0.42, W * 0.75, titleSize * 1.4, 'bold ' + titleSize + 'px "Noto Serif SC", Georgia, serif');

  if (subtitle) {
    ctx.fillStyle = '#9A9A9A';
    const subSize = W > 600 ? 18 : 13;
    ctx.font = subSize + 'px -apple-system, sans-serif';
    ctx.fillText(subtitle, W * 0.1 + lineW + 20, H * 0.72);
  }
}

// ===== 拖拽上传图片 =====
function initImageDragUpload() {
  const textarea = document.getElementById('markdown-input');
  if (!textarea) return;

  // 阻止默认拖拽行为
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    textarea.addEventListener(eventName, preventDefaults, false);
    document.body.addEventListener(eventName, preventDefaults, false);
  });

  // 拖拽进入/离开时的视觉反馈
  ['dragenter', 'dragover'].forEach(eventName => {
    textarea.addEventListener(eventName, highlight, false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    textarea.addEventListener(eventName, unhighlight, false);
  });

  // 处理拖放
  textarea.addEventListener('drop', handleImageDrop, false);
}

function preventDefaults(e) {
  e.preventDefault();
  e.stopPropagation();
}

function highlight(e) {
  const textarea = document.getElementById('markdown-input');
  if (textarea) textarea.classList.add('drag-over');
}

function unhighlight(e) {
  const textarea = document.getElementById('markdown-input');
  if (textarea) textarea.classList.remove('drag-over');
}

function handleImageDrop(e) {
  const dt = e.dataTransfer;
  const files = dt.files;

  if (files.length === 0) return;

  // 过滤出图片文件
  const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));

  if (imageFiles.length === 0) {
    showToast('请拖拽图片文件（JPG/PNG/GIF 等）');
    return;
  }

  const textarea = document.getElementById('markdown-input');
  const cursorPos = textarea.selectionStart;

  imageFiles.forEach((file, index) => {
    // 使用 Blob URL + 短 ID 存储，避免编辑器中出现冗长的 base64
    const imgId = ImageStore.store(file);
    const fileName = file.name.replace(/\.[^/.]+$/, ''); // 去掉扩展名
    
    // 插入简短的 Markdown 图片引用
    const markdownImage = `![${fileName}](img://${imgId})`;

    // 在光标位置插入 Markdown 图片语法
    const currentValue = textarea.value;
    const before = currentValue.substring(0, cursorPos);
    const after = currentValue.substring(cursorPos);

    // 确保前后有换行
    const prefix = (before.length > 0 && !before.endsWith('\n')) ? '\n\n' : '';
    const suffix = (after.length > 0 && !after.startsWith('\n')) ? '\n\n' : '';

    textarea.value = before + prefix + markdownImage + suffix + after;

    // 更新光标位置
    const newPos = before.length + prefix.length + markdownImage.length;
    textarea.setSelectionRange(newPos, newPos);
    textarea.focus();

    // 触发 input 事件更新预览
    textarea.dispatchEvent(new Event('input'));

    showToast(`图片 "${fileName}" 已插入 ✨`);
  });
}

function debounce(fn, wait) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), wait);
  };
}

async function copyHTML() {
  // 先将 Markdown 中的本地图片引用转换为 blob URL，再生成 HTML
  const resolvedMarkdown = ImageStore.resolveMarkdown(input.value);
  const html = parseMarkdown(resolvedMarkdown);
  
  // 将 HTML 中的 blob URL 转换为 base64（用于微信粘贴）
  const htmlWithBase64 = await convertBlobUrlsToBase64(html);
  const fullHTML = generateExportHTML(htmlWithBase64);

  navigator.clipboard.writeText(fullHTML).then(() => {
    showToast('HTML 已复制到剪贴板！');
  }).catch(() => {
    showToast('复制失败，请手动复制');
  });
}

// 将 HTML 中的 blob URL 转换为 base64
async function convertBlobUrlsToBase64(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const images = doc.querySelectorAll('img[src^="blob:"]');
  
  if (images.length === 0) return html;
  
  const convertPromises = Array.from(images).map(async (img) => {
    const blobUrl = img.getAttribute('src');
    try {
      const base64 = await ImageStore.blobUrlToBase64(blobUrl);
      img.setAttribute('src', base64);
    } catch (e) {
      console.error('转换图片失败:', e);
    }
  });
  
  await Promise.all(convertPromises);
  
  // 返回 body 内部的 HTML
  const body = doc.body;
  return body.innerHTML;
}

function generateExportHTML(contentHTML) {
  const fs = tweaks.fontSize;
  const displayFont = getComputedStyle(document.documentElement).getPropertyValue('--font-display').trim();
  const bodyFont = getComputedStyle(document.documentElement).getPropertyValue('--font-body').trim();
  const monoFont = getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim();
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim();
  const text = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim();
  const textSec = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
  const accent = tweaks.accent;
  const bgTertiary = getComputedStyle(document.documentElement).getPropertyValue('--bg-tertiary').trim();
  const maxW = tweaks.maxWidth;

  // 密度对应参数，使导出的 HTML 完美还原排版设置的密度
  const densityMap = {
    compact: { unit: 6, lh: 1.65 },
    comfortable: { unit: 8, lh: 1.85 },
    spacious: { unit: 10, lh: 2.0 }
  };
  const d = densityMap[tweaks.density];
  const unit = d.unit;
  const lh = d.lh;
  const blockquoteLh = Math.round(lh * 0.9 * 100) / 100;

  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: ${bodyFont};
  background: ${bg};
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}
.article {
  max-width: ${maxW}px;
  margin: 0 auto;
  padding: ${unit * 8}px 40px;
}
.article h1 {
  font-family: ${displayFont};
  font-size: ${Math.round(fs * 2.25)}px;
  font-weight: 400;
  line-height: 1.25;
  color: ${text};
  margin-bottom: ${unit * 3}px;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.article h2 {
  font-family: ${displayFont};
  font-size: ${Math.round(fs * 1.625)}px;
  font-weight: 400;
  line-height: 1.25;
  color: ${text};
  margin-top: ${unit * 8}px;
  margin-bottom: ${unit * 2}px;
}
.article h3 {
  font-size: ${Math.round(fs * 1.125)}px;
  font-weight: 600;
  color: ${text};
  margin-top: ${unit * 6}px;
  margin-bottom: ${unit}px;
}
.article p {
  font-size: ${fs}px;
  line-height: ${lh};
  color: ${textSec};
  margin-bottom: ${unit * 3}px;
  text-wrap: pretty;
}
.article blockquote {
  margin: ${unit * 4}px 0;
  padding: ${unit * 2}px ${unit * 3}px;
  border-left: 3px solid ${accent};
  background: ${hexToRgba(accent, 0.06)};
  border-radius: 0 8px 8px 0;
}
.article blockquote p {
  font-family: ${displayFont};
  font-size: ${fs + 1}px;
  font-style: italic;
  color: ${text};
  margin-bottom: ${unit}px;
  line-height: ${blockquoteLh};
}
.article pre {
  background: #1E1E1E;
  border-radius: 10px;
  padding: ${unit * 3}px;
  margin: ${unit * 4}px 0;
  overflow-x: auto;
}
.article pre code {
  font-family: ${monoFont};
  font-size: 13.5px;
  color: #D4D4D4;
  line-height: 1.65;
}
.article code {
  font-family: ${monoFont};
  font-size: 0.88em;
  background: ${bgTertiary};
  padding: 2px 6px;
  border-radius: 4px;
}
.article ul, .article ol {
  margin: ${unit * 3}px 0;
  padding-left: ${unit * 3.5}px;
}
.article li {
  font-size: ${fs}px;
  line-height: ${lh};
  color: ${textSec};
  margin-bottom: ${unit}px;
}
.article hr {
  border: none;
  height: 1px;
  background: rgba(0,0,0,0.08);
  margin: ${unit * 8}px auto;
  width: 60%;
}
.article a { color: ${accent}; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
.article a:hover { border-bottom-color: ${accent}; }
.article img { max-width: 100%; height: auto; border-radius: 8px; margin: ${unit * 4}px 0; display: block; }
.article strong { font-weight: 600; color: ${text}; }
.article table { width: 100%; border-collapse: collapse; margin: ${unit * 4}px 0; font-size: 14px; }
.article th { text-align: left; padding: ${unit}px ${unit * 2}px; border-bottom: 2px solid rgba(0,0,0,0.08); font-weight: 600; }
.article td { padding: ${unit}px ${unit * 2}px; border-bottom: 1px solid rgba(0,0,0,0.04); color: ${textSec}; }
@media (max-width: 600px) {
  .article { padding: ${unit * 5}px ${unit * 3}px; }
  .article h1 { font-size: ${Math.round(fs * 2.25 * 0.78)}px; }
  .article h2 { font-size: ${Math.round(fs * 1.625 * 0.85)}px; }
}
</style>
</head>
<body>
<article class="article">
${contentHTML}
</article>
</body>
</html>`;
}

function clearAll() {
  input.value = '';
  preview.innerHTML = '<p class="empty-state">在左侧输入 Markdown，这里将实时预览...</p>';
  updateStats();
  saveContent('');
}

function loadDemo() {
  input.value = demoContent;
  preview.innerHTML = parseMarkdown(demoContent);
  updateStats();
  saveContent(demoContent);
}

// ===== 导入导出 =====
function importMarkdown() {
  document.getElementById('file-input').click();
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    input.value = e.target.result;
    preview.innerHTML = parseMarkdown(e.target.result);
    updateStats();
    saveContent(e.target.result);
    showToast('已导入: ' + file.name);
  };
  reader.readAsText(file);
  event.target.value = '';
}

function handleImageFileSelect(event) {
  const files = event.target.files;
  if (files.length === 0) return;

  const textarea = document.getElementById('markdown-input');
  const cursorPos = textarea.selectionStart;

  Array.from(files).forEach((file, index) => {
    if (!file.type.startsWith('image/')) return;

    const imgId = ImageStore.store(file);
    const fileName = file.name.replace(/\.[^/.]+$/, '');

    const markdownImage = `![${fileName}](img://${imgId})`;

    const currentValue = textarea.value;
    const before = currentValue.substring(0, cursorPos);
    const after = currentValue.substring(cursorPos);

    const prefix = (before.length > 0 && !before.endsWith('\n')) ? '\n\n' : '';
    const suffix = (after.length > 0 && !after.startsWith('\n')) ? '\n\n' : '';

    textarea.value = before + prefix + markdownImage + suffix + after;

    const newPos = before.length + prefix.length + markdownImage.length;
    textarea.setSelectionRange(newPos, newPos);
    textarea.focus();

    textarea.dispatchEvent(new Event('input'));
  });

  const imageCount = Array.from(files).filter(f => f.type.startsWith('image/')).length;
  if (imageCount > 1) {
    showToast(`${imageCount} 张图片已批量插入 ✨`);
  } else if (imageCount === 1) {
    showToast(`图片已插入 ✨`);
  }

  event.target.value = '';
}

function exportMarkdown() {
  const content = input.value;
  if (!content.trim()) {
    showToast('没有内容可导出');
    return;
  }

  const blob = new Blob([content], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'article-' + new Date().toISOString().slice(0, 10) + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Markdown 已导出');
}

// ===== 全屏预览 =====
function toggleFullscreen() {
  document.body.classList.toggle('fullscreen-preview');
}

// ===== 分栏拖动 =====
(function initResizer() {
  const divider = document.getElementById('panel-divider');
  const leftPanel = document.getElementById('panel-left');
  const rightPanel = document.getElementById('panel-right');
  const main = document.getElementById('main');
  let isDragging = false;

  divider.addEventListener('mousedown', (e) => {
    isDragging = true;
    divider.classList.add('is-dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const rect = main.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pct = (x / rect.width) * 100;
    if (pct > 20 && pct < 80) {
      leftPanel.style.flex = 'none';
      rightPanel.style.flex = 'none';
      leftPanel.style.width = pct + '%';
      rightPanel.style.width = (100 - pct) + '%';
    }
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      divider.classList.remove('is-dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
})();

// ===== 键盘快捷键 =====
document.addEventListener('keydown', (e) => {
  if (e.target === input) {
    // 在输入框内：Tab 插入两个空格
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
      input.selectionStart = input.selectionEnd = start + 2;
      input.dispatchEvent(new Event('input'));
    }
    
    // 快捷键格式化包裹
    if (e.metaKey || e.ctrlKey) {
      const key = e.key.toLowerCase();
      if (key === 'b') {
        e.preventDefault();
        insertMarkdown('bold');
      } else if (key === 'i') {
        e.preventDefault();
        insertMarkdown('italic');
      } else if (key === 'l') {
        e.preventDefault();
        insertMarkdown('link');
      }
    }
    return;
  }

  // 全局快捷键
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 's') {
      e.preventDefault();
      exportMarkdown();
    } else if (e.key === 'o') {
      e.preventDefault();
      importMarkdown();
    } else if (e.key === 'k') {
      e.preventDefault();
      clearAll();
    } else if (e.key === 'd') {
      e.preventDefault();
      loadDemo();
    }
  }
  if (e.key === 'Escape') {
    if (document.body.classList.contains('fullscreen-preview')) {
      toggleFullscreen();
    }
    if (isTweaksOpen) {
      toggleTweaks();
    }
  }
});

// ===== 示例内容 =====
const demoContent = `# 设计的分寸感：Claude 风格排版的哲学

> 好的排版不是装饰，而是让内容以最自然的姿态呈现。
> — 设计笔记

## 一、为什么是「克制」

在设计公众号文章时，最常见的错误是**过度设计**。渐变色背景、花哨的边框、无处不在的 emoji —— 这些元素在分散注意力的同时，也在降低内容的可信度。

Claude 的设计哲学可以概括为三个词：

1. **温暖** - 米白色的背景让人联想到纸质书的质感
2. **克制** - 每个元素都必须 justify 自己的存在
3. **清晰** - 层级分明，让读者一眼找到重点

## 二、字体即语气

排版中，字体的选择比颜色更能传达气质。

| 场景 | 字体 | 气质 |
|------|------|------|
| 大标题 | Newsreader / 思源宋体 | 书卷气、权威感 |
| 正文 | 系统无衬线 | 现代、易读 |
| 代码 | JetBrains Mono | 技术感、精确 |
| 引用 | 宋体斜体 | 沉思、优雅 |

**衬线体做标题 + 无衬线做正文** 的组合，是编辑排版的经典范式。它让标题有「分量」，让正文保持阅读效率。

## 三、留白的数学

留白不是「空着」，而是**节奏**。

~~~css
/* 行高 */
line-height: 1.85;  /* 中文比英文需要更多呼吸空间 */

/* 段落间距 */
margin-bottom: 24px;  /* 足够区分段落，又不至于断裂 */

/* 章节间距 */
margin-top: 64px;  /* h2 前的大停顿，宣告新段落 */
~~~

这些数字不是随意定的。1.85 的行高让中文字符之间有恰到好处的空隙；64px 的章节间距让文章在视觉上形成「章节」的概念。

## 四、代码的尊严

代码块不是「把文字变成等宽字体」那么简单。

一个真正尊重代码的排版，应该：

- [x] 深色背景，与正文形成材质区分
- [x] 语法高亮，但配色克制（不刺眼）
- [x] 合适的字号（13.5px 左右）和行高
- [ ] 横向滚动，而不是换行破坏结构

~~~javascript
// 示例：一个简洁的函数
function measureText(text, options = {}) {
  const {
    fontSize = 16,
    lineHeight = 1.85,
    maxWidth = 680
  } = options;

  // 计算需要多少行
  const charsPerLine = Math.floor(maxWidth / (fontSize * 0.6));
  const lines = Math.ceil(text.length / charsPerLine);

  return {
    lines,
    height: lines * fontSize * lineHeight
  };
}
~~~

## 五、写在最后

好的排版工具应该**隐形**。它不抢内容的风头，只是 quietly 把每一行文字放到最合适的位置。

如果你认同这个理念，这个工具就是为你做的。

---

*用 Claude 排版，让内容回归内容本身。*`;

// ===== 滚动同步：左→右单向联动（章节锚点映射） =====
let isSyncing = false;
let syncRafId = null;

function initScrollSync() {
  const previewContainer = document.getElementById('preview-container');

  // ---- 辅助：获取 textarea 中所有标题行 ----
  function getSourceSections() {
    const lines = input.value.split('\n');
    const sections = [];
    lines.forEach((line, idx) => {
      const m = line.match(/^(#{1,6})\s+(.*)/);
      if (m) {
        sections.push({ level: m[1].length, text: m[2].trim(), lineIndex: idx });
      }
    });
    return sections;
  }

  // ---- 辅助：估算某一行在 textarea 中的 scrollTop ----
  function estimateLineScrollTop(lineIndex) {
    const style = getComputedStyle(input);
    const lh = parseFloat(style.lineHeight);
    const fontSize = parseFloat(style.fontSize);
    const lineHeight = isNaN(lh) ? fontSize * 1.7 : lh;
    const paddingTop = parseFloat(style.paddingTop) || 0;
    return paddingTop + lineIndex * lineHeight;
  }

  // ---- 辅助：找到当前 scrollTop 所在的章节索引 ----
  function findCurrentSection(sections) {
    if (sections.length === 0) return -1;
    // 以视口顶部偏上 15% 处作为当前阅读位置
    const currentTop = input.scrollTop + input.clientHeight * 0.15;
    for (let i = sections.length - 1; i >= 0; i--) {
      if (estimateLineScrollTop(sections[i].lineIndex) <= currentTop) return i;
    }
    return 0;
  }

  // ---- 核心同步函数 ----
  function syncScroll() {
    const sourceSections = getSourceSections();
    const previewHeadings = previewContainer.querySelectorAll('h1, h2, h3, h4, h5, h6');

    // 没有标题 → 回退到比例映射
    if (sourceSections.length === 0 || previewHeadings.length === 0) {
      const inputSH = input.scrollHeight - input.clientHeight;
      const previewSH = previewContainer.scrollHeight - previewContainer.clientHeight;
      if (inputSH > 0 && previewSH > 0) {
        const ratio = input.scrollTop / inputSH;
        previewContainer.scrollTop = ratio * previewSH;
      }
      return;
    }

    const currentIdx = findCurrentSection(sourceSections);
    const nextIdx = Math.min(currentIdx + 1, sourceSections.length - 1);

    // textarea 中当前章节的 scrollTop 区间
    const srcCurrentTop = estimateLineScrollTop(sourceSections[currentIdx].lineIndex);
    const srcNextTop = estimateLineScrollTop(sourceSections[nextIdx].lineIndex);
    const srcProgress = nextIdx === currentIdx ? 0 :
      (input.scrollTop - srcCurrentTop) / (srcNextTop - srcCurrentTop);

    // 预览区中对应章节的 offsetTop 区间
    const previewCurrentTop = previewHeadings[currentIdx].offsetTop;
    const previewNextTop = previewHeadings[nextIdx].offsetTop;
    const targetTop = previewCurrentTop + srcProgress * (previewNextTop - previewCurrentTop);

    previewContainer.scrollTop = Math.max(0, targetTop - 20);
  }

  // ---- 左侧编辑器滚动 → 同步右侧预览区 ----
  input.addEventListener('scroll', () => {
    if (isSyncing) return;
    if (syncRafId) cancelAnimationFrame(syncRafId);
    syncRafId = requestAnimationFrame(() => {
      isSyncing = true;
      syncScroll();
      isSyncing = false;
    });
  });

  // ---- 右侧预览区滚动 → 自由浏览，不回传 ----
  previewContainer.addEventListener('scroll', () => {
    if (isSyncing) return;
  });
}

// ===== Markdown 格式快捷插入函数 =====
function insertMarkdown(type) {
  const textarea = document.getElementById('markdown-input');
  if (!textarea) return;

  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const val = textarea.value;
  
  const selectedText = val.substring(start, end);
  let before = val.substring(0, start);
  let after = val.substring(end);
  
  let wrapBefore = '';
  let wrapAfter = '';
  let defaultText = '';
  let selectOffsetStart = 0;
  let selectOffsetEnd = 0;

  switch (type) {
    case 'bold':
      wrapBefore = '**';
      wrapAfter = '**';
      defaultText = '加粗文本';
      break;
    case 'italic':
      wrapBefore = '*';
      wrapAfter = '*';
      defaultText = '斜体文本';
      break;
    case 'strike':
      wrapBefore = '~~';
      wrapAfter = '~~';
      defaultText = '删除线文本';
      break;
    case 'code':
      wrapBefore = '`';
      wrapAfter = '`';
      defaultText = '代码';
      break;
    case 'h1':
      wrapBefore = before.endsWith('\n') || before === '' ? '# ' : '\n# ';
      wrapAfter = '\n';
      defaultText = '一级标题';
      break;
    case 'h2':
      wrapBefore = before.endsWith('\n') || before === '' ? '## ' : '\n## ';
      wrapAfter = '\n';
      defaultText = '二级标题';
      break;
    case 'h3':
      wrapBefore = before.endsWith('\n') || before === '' ? '### ' : '\n### ';
      wrapAfter = '\n';
      defaultText = '三级标题';
      break;
    case 'quote':
      wrapBefore = before.endsWith('\n') || before === '' ? '> ' : '\n> ';
      wrapAfter = '\n';
      defaultText = '引用文本';
      break;
    case 'ul':
      wrapBefore = before.endsWith('\n') || before === '' ? '- ' : '\n- ';
      wrapAfter = '\n';
      defaultText = '列表项';
      break;
    case 'ol':
      wrapBefore = before.endsWith('\n') || before === '' ? '1. ' : '\n1. ';
      wrapAfter = '\n';
      defaultText = '列表项';
      break;
    case 'link':
      wrapBefore = '[';
      wrapAfter = '](https://)';
      defaultText = selectedText || '链接文字';
      if (!selectedText) {
        selectOffsetStart = wrapBefore.length + defaultText.length + 2;
        selectOffsetEnd = selectOffsetStart + 8;
      }
      break;
    case 'image':
      document.getElementById('image-file-input').click();
      return;
    case 'table':
      wrapBefore = before.endsWith('\n') || before === '' ? '' : '\n';
      wrapAfter = '\n| 表头1 | 表头2 |\n| --- | --- |\n| 内容1 | 内容2 |\n';
      defaultText = '';
      break;
    case 'hr':
      wrapBefore = before.endsWith('\n') || before === '' ? '---\n' : '\n---\n';
      wrapAfter = '';
      defaultText = '';
      break;
  }

  const textToInsert = selectedText || defaultText;
  const replacement = wrapBefore + textToInsert + wrapAfter;
  
  textarea.value = before + replacement + after;
  textarea.focus();

  if (selectedText) {
    textarea.setSelectionRange(start + wrapBefore.length, start + wrapBefore.length + selectedText.length);
  } else if (defaultText) {
    if (selectOffsetStart > 0) {
      textarea.setSelectionRange(start + selectOffsetStart, start + selectOffsetEnd);
    } else {
      textarea.setSelectionRange(start + wrapBefore.length, start + wrapBefore.length + defaultText.length);
    }
  } else {
    const newCursorPos = start + replacement.length;
    textarea.setSelectionRange(newCursorPos, newCursorPos);
  }

  textarea.dispatchEvent(new Event('input'));
}

// ===== 初始化 =====
(function init() {
  // 1. 先尝试从草稿箱恢复
  const savedDraftId = localStorage.getItem(CURRENT_DRAFT_KEY);
  const drafts = getDrafts();

  if (savedDraftId) {
    const draft = drafts.find(d => d.id === savedDraftId);
    if (draft) {
      currentDraftId = savedDraftId;
      input.value = draft.content || '';
      preview.innerHTML = parseMarkdown(draft.content || '');
    } else if (drafts.length > 0) {
      // 草稿已删除，加载最新的
      currentDraftId = drafts[0].id;
      input.value = drafts[0].content || '';
      preview.innerHTML = parseMarkdown(drafts[0].content || '');
    } else {
      // 没有草稿，从旧存储迁移
      const saved = loadContent();
      if (saved) {
        // 创建新草稿并导入旧内容
        const newDraft = {
          id: generateId(),
          title: getDraftTitle(saved),
          content: saved,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          versions: []
        };
        saveDrafts([newDraft]);
        currentDraftId = newDraft.id;
        localStorage.setItem(CURRENT_DRAFT_KEY, currentDraftId);
        input.value = saved;
        preview.innerHTML = parseMarkdown(saved);
      } else {
        input.value = demoContent;
        preview.innerHTML = parseMarkdown(demoContent);
      }
    }
  } else if (drafts.length > 0) {
    currentDraftId = drafts[0].id;
    input.value = drafts[0].content || '';
    preview.innerHTML = parseMarkdown(drafts[0].content || '');
  } else {
    // 首次使用，加载示例并创建初始草稿
    const newDraft = {
      id: generateId(),
      title: getDraftTitle(demoContent),
      content: demoContent,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      versions: []
    };
    saveDrafts([newDraft]);
    currentDraftId = newDraft.id;
    localStorage.setItem(CURRENT_DRAFT_KEY, currentDraftId);
    input.value = demoContent;
    preview.innerHTML = parseMarkdown(demoContent);
  }

  // 应用主题
  applyTheme();

  // 更新统计
  updateStats();

  // 初始化滚动同步
  initScrollSync();

  // 启动每 30 秒自动保存
  autoSaveInterval = setInterval(() => {
    if (currentDraftId) {
      autoSaveCurrentDraft();
    }
  }, 30000);

  // 页面关闭前保存
  window.addEventListener('beforeunload', () => {
    if (currentDraftId) {
      autoSaveCurrentDraft();
    }
  });
})();
